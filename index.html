<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060D16">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Logbuch">
<title>Arena Logbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#060D16;
  --bg-deep:#040910;
  --panel:#0C1826;
  --panel-2:#112438;
  --panel-3:#16304a;
  --line:#22374d;
  --gold-line:rgba(200,170,110,.34);
  --gold:#C8AA6E;
  --gold-hi:#F0D9A8;
  --teal:#0AC8B9;
  --ink:#EAE0CC;
  --ink-2:#A8BACB;
  --ink-3:#6E8399;
  --win:#C8AA6E;
  --second:#A6BCD0;
  --loss:#C0413F;
  --bevel:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);
  --bevel-sm:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  --fs:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Cinzel','Times New Roman',serif;
  --fc:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 78% -12%,rgba(10,200,185,.10),transparent 62%),
    radial-gradient(900px 520px at 8% 0%,rgba(200,170,110,.10),transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--fs);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:rgba(200,170,110,.3)}

.wrap{max-width:1280px;margin:0 auto;padding:26px 22px 80px}

/* ---------- frame ---------- */
.frame{background:linear-gradient(150deg,rgba(200,170,110,.55),rgba(200,170,110,.16) 42%,rgba(34,55,77,.9));clip-path:var(--bevel);padding:1px}
.frame>.inner{background:linear-gradient(180deg,var(--panel-2),var(--panel));clip-path:var(--bevel);padding:20px 22px}
.eyebrow{font-family:var(--fc);text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--gold);font-weight:600}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}

/* ---------- header ---------- */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 24px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--gold-line);position:relative}
header.top::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.brand{display:grid;grid-template-columns:46px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:14px;align-items:center}
.brand .mark{width:46px;height:46px;grid-row:1/3;align-self:center}
.brand h1{font-size:30px;line-height:1.1;color:var(--gold-hi)}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;max-width:56ch;grid-column:1/3}
.teambar{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.sel{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 12px;clip-path:var(--bevel-sm);min-width:190px}
.sel:hover{border-color:var(--gold-line)}
.btn{background:var(--panel-2);border:1px solid var(--gold-line);color:var(--gold-hi);padding:9px 16px;clip-path:var(--bevel-sm);font-family:var(--fc);text-transform:uppercase;letter-spacing:.12em;font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.btn:hover{background:rgba(200,170,110,.16)}
.btn.primary{background:linear-gradient(180deg,#C8AA6E,#9c7f45);border-color:#E4CB93;color:#10202f}
.btn.primary:hover{background:linear-gradient(180deg,#E0C288,#b08e4c)}
.btn.primary:disabled{background:#1a2a3a;border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{color:var(--gold-hi);border-color:var(--gold-line);background:rgba(200,170,110,.08)}
.btn.sm{padding:5px 10px;font-size:12px;letter-spacing:.09em}
.btn.danger{color:#e2807e;border-color:rgba(192,65,63,.5)}
.btn.danger:hover{background:rgba(192,65,63,.16)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}

/* ---------- notice ---------- */
.notice{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--gold);background:rgba(200,170,110,.09);padding:11px 14px;margin-bottom:20px;font-size:13.5px;color:var(--ink-2)}
.notice b{color:var(--gold-hi);font-weight:600}
.notice.warn{border-left-color:var(--loss);background:rgba(192,65,63,.1)}

/* ---------- match form ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:19px;color:var(--gold-hi)}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:rgba(3,10,18,.5);border:1px solid var(--line);padding:9px;clip-path:var(--bevel-sm)}
.slot-main{display:flex;flex-direction:column;gap:7px;min-width:0}
.slot-row{display:flex;gap:7px;align-items:center;min-width:0}
.pname{flex:1 1 0;min-width:0;max-width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 8px;font-size:13.5px}
.slot-x{background:none;border:1px solid transparent;color:var(--ink-3);width:26px;height:26px;line-height:1;font-size:17px;align-self:start}
.slot-x:hover{color:var(--loss);border-color:rgba(192,65,63,.4)}

/* champion combobox */
.cbx{position:relative;flex:1 1 0;min-width:0;max-width:100%}
.cbx-btn{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line);padding:5px 8px;text-align:left;min-width:0}
.cbx-btn:hover{border-color:var(--gold-line)}
.cbx-btn img{width:30px;height:30px;flex:none;border:1px solid var(--gold-line);object-fit:cover}
.cbx-ph{width:30px;height:30px;flex:none;border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:15px}
.cbx-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cbx-label.empty{color:var(--ink-3)}
.cbx-pop{position:fixed;z-index:120;width:min(340px,92vw);background:var(--panel);border:1px solid var(--gold-line);box-shadow:0 18px 44px rgba(0,0,0,.7);padding:8px}
.cbx-pop input{width:100%;background:var(--bg-deep);border:1px solid var(--line);padding:7px 9px;margin-bottom:7px}
.cbx-hint{font-size:11.5px;color:var(--ink-3);padding:0 2px 7px}
.cbx-list{max-height:264px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.cbx-item{display:flex;align-items:center;gap:9px;padding:4px 6px;background:none;border:0;text-align:left;width:100%}
.cbx-item img{width:28px;height:28px;flex:none}
.cbx-item:hover,.cbx-item.on{background:rgba(200,170,110,.16);color:var(--gold-hi)}
.cbx-empty{padding:12px 6px;color:var(--ink-3);font-size:13px}

/* pick-mode toggle */
.seg{display:flex;border:1px solid var(--line);flex:none}
.seg button{background:transparent;border:0;padding:5px 10px;font-family:var(--fc);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600;color:var(--ink-3)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(200,170,110,.18);color:var(--gold-hi)}
.seg button.brav[aria-pressed="true"]{background:rgba(10,200,185,.18);color:var(--teal)}

.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.res{padding:11px 6px;background:rgba(3,10,18,.5);border:1px solid var(--line);font-family:var(--fc);text-transform:uppercase;letter-spacing:.11em;font-weight:600;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
.res span.rank{font-family:var(--fd);font-size:19px;line-height:1}
.res[aria-pressed="true"]{color:#0d1a26}
.res.win[aria-pressed="true"]{background:linear-gradient(180deg,#E0C288,#B0904F);border-color:#E4CB93}
.res.second[aria-pressed="true"]{background:linear-gradient(180deg,#C4D5E4,#8EA6BC);border-color:#D3E1EE}
.res.loss[aria-pressed="true"]{background:linear-gradient(180deg,#C0413F,#8b2f2d);border-color:#d4615f;color:#fdeaea}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--panel);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.tile .k{font-family:var(--fc);text-transform:uppercase;letter-spacing:.13em;font-size:11.5px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--fd);font-size:27px;line-height:1.05;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* result distribution bar */
.distbar{display:flex;height:12px;border:1px solid var(--line);overflow:hidden}
.distbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;font-size:12.5px;color:var(--ink-2)}
.legend b{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* ---------- tables / bars ---------- */
.scrollx{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--fc);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--ink-3);text-align:left;font-weight:600;padding:0 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid rgba(34,55,77,.55);vertical-align:middle;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right;padding-right:16px;padding-left:16px}
td.num:last-child,th.num:last-child{padding-right:0}
.modelabel{font-family:var(--fc);text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--ink-3);font-weight:600}
tr:last-child td{border-bottom:0}
.pdot{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:0}
.rate{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ratebar{width:78px;height:6px;background:rgba(255,255,255,.07);flex:none}
.ratebar i{display:block;height:100%;background:var(--gold)}

/* wer spielt wen */
.pblocks{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.pblock{background:var(--panel);padding:12px 13px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:10px}
.pname-l{font-weight:600;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(3,10,18,.55);border:1px solid var(--line);padding:5px 10px 5px 5px;max-width:100%}
.chip:hover{border-color:var(--gold-line)}
.chip img{width:30px;height:30px;flex:none;border:1px solid var(--gold-line)}
.chip-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.chip-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-sub{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
table.matrix td.chcell{display:flex;align-items:center;gap:9px;white-space:nowrap;padding-right:16px}
table.matrix td.chcell img{width:28px;height:28px;flex:none;border:1px solid var(--gold-line)}
table.matrix td.hit{font-weight:600;color:var(--ink)}
table.matrix td.dim{color:var(--ink-3)}
table.matrix th .pdot{margin-right:6px}
.bmark{color:var(--teal);font-size:11px}

/* history */
.hist{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.hrow{background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 12px}
.hrow:hover{background:var(--panel-2)}
.pill{font-family:var(--fc);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:700;padding:3px 9px;flex:none;color:#0d1a26}
.pill.win{background:linear-gradient(180deg,#E0C288,#B0904F)}
.pill.second{background:linear-gradient(180deg,#C4D5E4,#8EA6BC)}
.pill.loss{background:linear-gradient(180deg,#C0413F,#8b2f2d);color:#fdeaea}
.hpicks{display:flex;flex-wrap:wrap;gap:10px;flex:1;min-width:0}
.hpick{display:flex;align-items:center;gap:7px;min-width:0}
.hpick .ic{position:relative;flex:none}
.hpick img{width:32px;height:32px;display:block;border:1px solid var(--gold-line)}
.bravtag{position:absolute;right:-3px;bottom:-3px;background:var(--teal);color:#04121a;font-family:var(--fc);font-size:10px;font-weight:700;line-height:1;padding:2px 3px;letter-spacing:.04em}
.hpick .txt{min-width:0;line-height:1.25}
.hpick .who{font-size:12.5px;font-weight:600}
.hpick .ch{font-size:11.5px;color:var(--ink-3)}
.hdate{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

/* champion pool */
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:14px}
.pc{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--panel);padding:0;display:block}
.pc img{width:100%;height:100%;display:block;object-fit:cover;filter:grayscale(1) brightness(.42);transition:filter .18s}
.pc.played{border-color:var(--gold)}
.pc.played img{filter:none}
.pc:hover img{filter:none}
.pc .cnt{position:absolute;right:0;bottom:0;background:rgba(200,170,110,.92);color:#0d1a26;font-family:var(--fc);font-size:11px;font-weight:700;line-height:1;padding:2px 4px}
.poolhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;justify-content:space-between}
.poolbar{height:5px;background:rgba(255,255,255,.07);margin-top:12px}
.poolbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--teal))}

/* dialog */
.veil{position:fixed;inset:0;background:rgba(3,8,14,.78);display:grid;place-items:start center;padding:5vh 16px;z-index:80;overflow-y:auto}
.modal{width:min(520px,100%)}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.pedit{display:flex;align-items:center;gap:9px}
.pedit input{flex:1;background:var(--bg-deep);border:1px solid var(--line);padding:8px 10px}
.swatch{width:14px;height:14px;flex:none}
.rowend{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.empty{color:var(--ink-3);font-size:13.5px;padding:14px 0}
.notice .x{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:16px;line-height:1;padding:0 2px}
.notice .x:hover{color:var(--gold-hi)}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}

/* ---------- Handy ---------- */
@media (max-width:700px){
  .wrap{padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  header.top{gap:14px;padding-bottom:14px;margin-bottom:16px}
  .brand{grid-template-columns:40px minmax(0,1fr);column-gap:11px}
  .brand .mark{width:40px;height:40px}
  .brand h1{font-size:24px}
  .brand p{font-size:13px}
  .teambar{margin-left:0;width:100%;gap:8px}
  .sel{flex:1 1 100%;min-width:0}
  .teambar .btn{flex:1 1 40%}
  .cols{gap:16px}
  .stack{gap:16px}
  .frame>.inner{padding:15px 14px}
  .sec-head h2{font-size:17px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:23px}
  .results{gap:6px}
  .res{padding:12px 4px;font-size:12.5px}
  .chip{padding:5px 9px 5px 5px}
  .chip img{width:28px;height:28px}
  .pblock{padding:11px 12px}
  .hrow{gap:9px;padding:11px 11px}
  .hpicks{gap:10px;flex:1 1 100%;order:3}
  .sec-head{flex-wrap:wrap;row-gap:8px}
  .hdate{order:2;margin-left:auto}
  .pool{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
  footer{margin-top:20px}
  .veil{padding:3vh 10px}
}
@media (pointer:coarse){
  .btn{padding:12px 16px}
  .btn.sm{padding:9px 12px}
  .seg button{padding:10px 14px;font-size:12.5px}
  .cbx-btn{padding:8px}
  .cbx-item{padding:9px 8px}
  .cbx-item img{width:32px;height:32px}
  .slot-x{width:36px;height:36px;font-size:20px}
  .notice .x{padding:6px 8px;font-size:18px}
  .pname,.pedit input,.cbx-pop input{font-size:16px;padding:10px}
  .sel{font-size:16px}
  .pc{min-height:44px}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="20,2 98,2 98,80 80,98 2,98 2,20" fill="#091422" stroke="#C8AA6E" stroke-width="3"></polygon>
        <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" fill="none" stroke="#C8AA6E" stroke-width="7"></polygon>
        <polygon points="50,26 63,43 59,74 41,74 37,43" fill="#0AC8B9"></polygon>
        <polygon points="50,26 63,43 50,74 48,44" fill="#96F2E8"></polygon>
      </svg>
      <div class="eyebrow">Arena &middot; 2v2v2v2</div>
      <h1>Arena Logbuch</h1>
      <p>Champion, Pick-Modus und Platzierung pro Runde festhalten &ndash; und sehen, welche Kombination bei euch wirklich funktioniert.</p>
    </div>
    <div class="teambar">
      <select class="sel" id="teamSel" aria-label="Team auswählen"></select>
      <button class="btn ghost" id="editTeam">Team bearbeiten</button>
      <button class="btn" id="newTeam">Neues Team</button>
    </div>
  </header>

  <div id="notices"></div>

  <div class="cols">
    <div class="stack">
      <section class="frame"><div class="inner" id="formPanel"></div></section>
    </div>
    <div class="stack">
      <section class="frame"><div class="inner" id="statPanel"></div></section>
      <section class="frame"><div class="inner" id="champPanel"></div></section>
      <section class="frame"><div class="inner" id="histPanel"></div></section>
    </div>
  </div>

  <section class="frame" style="margin-top:22px"><div class="inner" id="poolPanel"></div></section>

  <footer id="footer"></footer>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden onchange="doImport(this)">

const CH_BY_ID = new Map(CHAMPS.map(c => [c[0], c]));

const champIcon = id => (CH_BY_ID.get(id) || [id, id, ''])[2];

const HOSTED = !!(typeof window !== 'undefined' && window.claude && window.claude.use);
const PALETTE = ['#F0C97B', '#0AC8B9', '#9B8CFF', '#FF8A5B', '#5FB8FF'];
const RANDOM = { id: '__random', name: 'Random', color: '#7C8B9C', random: true };
function rosterOf(t) { return t ? t.players.concat([RANDOM]) : [RANDOM]; }
function playerById(t, id) { return id === RANDOM.id ? RANDOM : (t ? t.players.find(p => p.id === id) : null); }
const RESULTS = {
  win:    { label: 'Sieg',       rank: '1.', color: '#C8AA6E' },
  second: { label: '2. Platz',   rank: '2.', color: '#A6BCD0' },
  loss:   { label: 'Niederlage', rank: '–', color: '#C0413F' }
};
const norm = s => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
const CH_SEARCH = CHAMPS.map(c => {
  const parts = c[1].split(/[^A-Za-z]+/).filter(Boolean);
  return { id: c[0], name: c[1], key: norm(c[1]),
    initials: parts.map(w => w[0].toLowerCase()).join(''),
    words: parts.map(w => w.toLowerCase()) };
});
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

/* ---------------- storage ---------------- */
let db = null, storeMode = 'local';
let dbSettled = false, liveTeams = null, liveMatches = null;
const LS = 'arenaLog.v1';
let teams = [], matches = [], curTeamId = null;

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) { const d = JSON.parse(raw); teams = d.teams || []; matches = d.matches || []; }
  } catch (e) {}
}
function saveLocal() {
  if (storeMode !== 'local') return;
  try { localStorage.setItem(LS, JSON.stringify({ teams, matches })); } catch (e) {}
}

/* ---------------- Standard-Kader ---------------- */
const DEFAULT_PLAYERS = ['Manuel', 'Norbert', 'David'];
function seedTeam() {
  return { id: 'seed', name: 'Unser Team', unsaved: true,
    players: DEFAULT_PLAYERS.map((n, i) => ({ id: 'p' + (i + 1), name: n, color: PALETTE[i] })) };
}

/* ---------------- boot ---------------- */
function currentTeam() { return teams.find(t => t.id === curTeamId) || teams[0] || null; }
function teamMatches() {
  const t = currentTeam(); if (!t) return [];
  return matches.filter(m => m.teamId === t.id).sort((a, b) => b.ts - a.ts);
}
function applySeed() {
  if (teams.length === 0) { teams = [seedTeam()]; curTeamId = 'seed'; }
}
function isSeed() { const t = currentTeam(); return !!(t && t.unsaved); }

function syncFromDb() {
  teams = liveTeams || [];
  matches = liveMatches || [];
  if (teams.length === 0) applySeed();
  if (!teams.find(t => t.id === curTeamId)) { curTeamId = teams[0] ? teams[0].id : null; resetDraft(); }
  renderAll();
}
function connectDb() {
  const p = HOSTED ? window.claude.use('db') : Promise.resolve(null);
  p.then(handle => {
    if (!handle) { connectFirebase(); return; }
    dbSettled = true;
    db = handle; storeMode = 'db';
    db.collection('teams').onSnapshot(snap => {
      liveTeams = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      syncFromDb();
    }, err => { flash('Teams konnten nicht geladen werden (' + err.code + ').', true); });
    db.collection('matches').onSnapshot(snap => {
      liveMatches = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      syncFromDb();
    }, err => { flash('Runden konnten nicht geladen werden (' + err.code + ').', true); });
  }).catch(() => { connectFirebase(); });
}

let flashMsg = null;
function flash(text, bad) { flashMsg = { text: text, bad: !!bad }; renderNotices(); setTimeout(() => { flashMsg = null; renderNotices(); }, 6000); }

/* ---------------- writes ---------------- */
let fb = null;
function isRemote() { return storeMode === 'db' || storeMode === 'firebase'; }
async function storeAdd(col, data) {
  if (storeMode === 'firebase') { const r = await fb.addDoc(fb.col(col), data); return r.id; }
  const ref = await db.collection(col).add(data); return ref.id;
}
async function storeSet(col, id, data) {
  if (storeMode === 'firebase') { await fb.setDoc(fb.doc(col + '/' + id), data); return; }
  await db.doc(col + '/' + id).set(data);
}
async function storeDelete(col, id) {
  if (storeMode === 'firebase') { await fb.deleteDoc(fb.doc(col + '/' + id)); return; }
  await db.doc(col + '/' + id).delete();
}

async function connectFirebase() {
  const cfg = window.ARENA_FIREBASE, code = (window.ARENA_TEAM_CODE || '').trim();
  if (!cfg || !cfg.projectId || /^DEIN/i.test(cfg.projectId) || !code) { dbSettled = true; renderNotices(); return; }
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.0/';
    const [appMod, fsMod] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-firestore.js')]);
    const store = fsMod.getFirestore(appMod.initializeApp(cfg));
    const base = 'logs/' + code;
    fb = {
      addDoc: fsMod.addDoc, setDoc: fsMod.setDoc, deleteDoc: fsMod.deleteDoc, code: code,
      col: n => fsMod.collection(store, base + '/' + n),
      doc: n => fsMod.doc(store, base + '/' + n)
    };
    storeMode = 'firebase'; dbSettled = true;
    const watch = (name, set) => fsMod.onSnapshot(fb.col(name),
      snap => { set(snap.docs.map(d => Object.assign({ id: d.id }, d.data()))); syncFromDb(); },
      err => { storeMode = 'local'; renderNotices(); flash('Verbindung zum gemeinsamen Logbuch fehlgeschlagen (' + err.code + ').', true); });
    watch('teams', v => { liveTeams = v; });
    watch('matches', v => { liveMatches = v; });
    renderNotices();
  } catch (e) {
    storeMode = 'local'; dbSettled = true; renderNotices();
  }
}

async function putTeam(team) {
  if (isRemote()) {
    const body = { name: team.name, players: team.players };
    if (team.id && team.id !== 'seed' && teams.some(t => t.id === team.id && !t.unsaved)) {
      await storeSet('teams', team.id, body);
      return team.id;
    }
    return await storeAdd('teams', body);
  }
  const ex = team.id && team.id !== 'seed' ? teams.find(t => t.id === team.id && !t.unsaved) : null;
  if (ex) { Object.assign(ex, team); saveLocal(); return ex.id; }
  teams = teams.filter(t => !t.unsaved);
  team = Object.assign({}, team, { id: uid() }); delete team.unsaved;
  teams.push(team); saveLocal(); return team.id;
}

async function removeTeam(id) {
  const t = teams.find(x => x.id === id);
  if (t && t.unsaved) { teams = teams.filter(x => x.id !== id); curTeamId = null; applySeed(); resetDraft(); renderAll(); return; }
  const own = matches.filter(m => m.teamId === id);
  if (isRemote()) {
    for (const m of own) { try { await storeDelete('matches', m.id); } catch (e) {} }
    await storeDelete('teams', id);
  } else {
    matches = matches.filter(m => m.teamId !== id);
    teams = teams.filter(t => t.id !== id);
    curTeamId = teams[0] ? teams[0].id : null;
    saveLocal(); applySeed(); renderAll();
  }
}

async function addMatch(rec) {
  if (isRemote()) { await storeAdd('matches', rec); return; }
  matches.push(Object.assign({ id: uid() }, rec));
  saveLocal(); renderAll();
}
async function delMatch(id) {
  if (isRemote()) { await storeDelete('matches', id); return; }
  matches = matches.filter(m => m.id !== id); saveLocal(); renderAll();
}

/* ---------------- draft ---------------- */
let draft = { result: null, slots: [{ pid: null, champ: null, mode: 'regular' }, { pid: null, champ: null, mode: 'regular' }] };
function resetDraft() {
  const t = currentTeam();
  const ps = t ? t.players : [];
  const n = Math.max(2, Math.min(3, ps.length));
  draft = { result: null, slots: Array.from({ length: n }, (_, i) =>
    ({ pid: ps[i] ? ps[i].id : null, champ: null, mode: 'regular' })) };
}

/* ---------------- render ---------------- */
function renderAll() {
  const t = currentTeam();
  if (draft.slots.some(s => s.pid && s.pid !== RANDOM.id && t && !t.players.some(p => p.id === s.pid))) resetDraft();
  renderTeamBar(); renderNotices(); renderForm(); renderStats(); renderChampChart(); renderHistory(); renderPool(); renderFooter();
}

function renderTeamBar() {
  const sel = document.getElementById('teamSel');
  sel.innerHTML = teams.map(t => '<option value="' + esc(t.id) + '"' + (t.id === curTeamId ? ' selected' : '') + '>' + esc(t.name) + ' · ' + t.players.length + '</option>').join('') ||
    '<option value="">Noch kein Team</option>';
  sel.disabled = teams.length === 0;
  document.getElementById('editTeam').disabled = !currentTeam();
}

let hideStorageNote = false;
function renderNotices() {
  const box = document.getElementById('notices');
  let h = '';
  if (flashMsg) h += '<div class="notice' + (flashMsg.bad ? ' warn' : '') + '"><div>' + esc(flashMsg.text) + '</div></div>';
  if (!hideStorageNote && storeMode === 'local' && (!HOSTED || dbSettled)) {
    h += (window.ARENA_FIREBASE && !/^DEIN/i.test(window.ARENA_FIREBASE.projectId || ''))
      ? '<div class="notice warn"><div><b>Kein Kontakt zum gemeinsamen Logbuch.</b> Deine Runden werden solange hier auf dem Gerät gespeichert. Prüfe die Internetverbindung und lade die App neu &ndash; danach gleicht sie sich wieder mit den anderen ab.</div><button class="x" title="Hinweis ausblenden" onclick="hideStorageNote=true;renderNotices()">×</button></div>'
      : HOSTED
      ? '<div class="notice warn"><div><b>Geteilte Ablage nicht erreichbar.</b> Deine Runden werden trotzdem gespeichert &ndash; im Speicher dieses Browsers. Sobald die Verbindung wieder steht, synchronisiert ein Neuladen sie mit deinem Team.</div><button class="x" title="Hinweis ausblenden" onclick="hideStorageNote=true;renderNotices()">×</button></div>'
      : '<div class="notice"><div><b>Offline-Fassung.</b> Diese Datei speichert alles in diesem Browser &ndash; das ist hier so gewollt und funktioniert dauerhaft. Nur teilen können deine Mitspieler dabei nicht.</div><button class="x" title="Hinweis ausblenden" onclick="hideStorageNote=true;renderNotices()">×</button></div>';
  }
  box.innerHTML = h;
}

function renderFooter() {
  const el = document.getElementById('footer');
  const n = matches.length, tn = teams.length;
  const sync = storeMode === 'firebase'
    ? ' · <span style="color:var(--teal)">● live mit deinem Team verbunden</span>'
    : (storeMode === 'db' ? ' · <span style="color:var(--teal)">● geteilt gespeichert</span>' : ' · nur auf diesem Gerät');
  el.innerHTML = '<span>' + tn + (tn === 1 ? ' Team' : ' Teams') + ' · ' + n + (n === 1 ? ' Runde' : ' Runden') +
    sync + '</span>' +
    ((resetArmed
      ? '<span style="display:flex;gap:9px;align-items:center"><span>Alle Teams und Runden werden gelöscht.</span>' +
        '<button class="btn danger sm" onclick="resetAll()">Ja, alles löschen</button>' +
        '<button class="btn ghost sm" onclick="resetArmed=false;renderFooter()">Abbrechen</button></span>'
      : '<span style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn ghost sm" onclick="exportData()">Sichern</button>' +
          '<button class="btn ghost sm" onclick="document.getElementById(\'importFile\').click()">Sicherung laden</button>' +
          '<button class="btn ghost sm" onclick="resetArmed=true;renderFooter()">Alle Daten löschen</button></span>'));
}

/* ----- Sicherung ----- */
async function exportData() {
  const payload = { app: 'arena-logbuch', v: 1, exportedAt: new Date().toISOString(),
    teams: teams.filter(t => !t.unsaved), matches: matches };
  const text = JSON.stringify(payload, null, 2);
  const name = 'arena-logbuch-' + new Date().toISOString().slice(0, 10) + '.json';
  if (HOSTED) {
    try {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename: name, data: text }); flash('Sicherung gespeichert.'); return; }
    } catch (e) {}
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    flash('Sicherung als ' + name + ' gespeichert.');
  } catch (e) { flash('Sicherung konnte nicht erstellt werden.', true); }
}

const teamSig = t => (t.name || '').trim().toLowerCase() + '|' +
  (t.players || []).map(p => (p.name || '').trim().toLowerCase()).sort().join(',');

async function doImport(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); }
  catch (e) { flash('Die Datei ließ sich nicht lesen — ist es die JSON-Sicherung?', true); return; }
  if (!data || !Array.isArray(data.teams) || !Array.isArray(data.matches)) {
    flash('Das sieht nicht nach einer Arena-Logbuch-Sicherung aus.', true); return;
  }
  let newTeams = 0, newRounds = 0;
  const teamMap = {}, playerMap = {};
  try {
    for (const it of data.teams) {
      if (!it || !Array.isArray(it.players)) continue;
      const hit = teams.filter(t => !t.unsaved).find(t => teamSig(t) === teamSig(it));
      if (hit) {
        teamMap[it.id] = hit.id;
        playerMap[hit.id] = {};
        it.players.forEach(p => {
          const q = hit.players.find(x => (x.name || '').trim().toLowerCase() === (p.name || '').trim().toLowerCase());
          playerMap[hit.id][p.id] = q ? q.id : p.id;
        });
      } else {
        const id = await putTeam({ id: null, name: it.name, players: it.players });
        teamMap[it.id] = id; playerMap[id] = {}; newTeams++;
      }
    }
    const seen = new Set(matches.map(m => m.teamId + '|' + m.ts));
    for (const im of data.matches) {
      const tid = teamMap[im.teamId];
      if (!tid || !im.ts) continue;
      const key = tid + '|' + im.ts;
      if (seen.has(key)) continue;
      seen.add(key);
      const map = playerMap[tid] || {};
      await addMatch({ teamId: tid, ts: im.ts, result: im.result,
        picks: (im.picks || []).map(pk => ({ p: map[pk.p] || pk.p, c: pk.c, m: pk.m })) });
      newRounds++;
    }
    renderAll();
    flash(newRounds || newTeams
      ? 'Übernommen: ' + plural(newRounds, 'neue Runde', 'neue Runden') + ', ' + plural(newTeams, 'neues Team', 'neue Teams') + '.'
      : 'Nichts Neues dabei — alle Runden waren schon vorhanden.');
  } catch (e) { flash('Beim Einlesen ist etwas schiefgegangen.', true); }
}
let resetArmed = false;
async function resetAll() {
  resetArmed = false;
  try {
    if (isRemote()) {
      for (const m of matches.slice()) { try { await storeDelete('matches', m.id); } catch (e) {} }
      for (const t of teams.slice()) { try { await storeDelete('teams', t.id); } catch (e) {} }
    } else {
      try { localStorage.removeItem(LS); } catch (e) {}
      teams = []; matches = []; curTeamId = null; applySeed(); resetDraft(); renderAll();
    }
    flash('Alle Daten gelöscht. Du startest wieder bei null.');
  } catch (e) { flash('Löschen fehlgeschlagen.', true); }
}

/* ----- champion combobox ----- */
let combo = null;
function placeCombo() {
  if (!combo) return;
  const r = combo.host.getBoundingClientRect();
  const pop = combo.pop;
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  if (vw < 700) pop.style.width = (vw - 16) + 'px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(Math.max(8, r.left), Math.max(8, vw - w - 8));
  let top = r.bottom + 4;
  if (top + h > vh - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function openCombo(i) {
  closeCombo();
  const host = document.getElementById('cbx' + i);
  const pop = document.createElement('div');
  pop.className = 'cbx-pop';
  pop.innerHTML = '<input type="text" placeholder="Anfangsbuchstaben tippen, z. B. „se“ oder „tf“" aria-label="Champion suchen">' +
    '<div class="cbx-hint">Enter übernimmt den obersten Treffer · ↑ ↓ blättern</div><div class="cbx-list"></div>';
  document.body.appendChild(pop);
  combo = { i: i, pop: pop, host: host, sel: 0, list: [] };
  const input = pop.querySelector('input');
  input.addEventListener('input', () => { combo.sel = 0; fillCombo(input.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); combo.sel = Math.max(0, Math.min(combo.list.length - 1, combo.sel + (e.key === 'ArrowDown' ? 1 : -1))); paintCombo();
    } else if (e.key === 'Enter') { e.preventDefault(); if (combo.list[combo.sel]) pickChamp(combo.list[combo.sel].id); }
    else if (e.key === 'Escape') { closeCombo(); }
  });
  fillCombo('');
  placeCombo();
  try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
  window.addEventListener('resize', placeCombo);
  window.addEventListener('scroll', placeCombo, true);
  setTimeout(() => document.addEventListener('mousedown', outsideCombo), 0);
}
function outsideCombo(e) { if (combo && !combo.pop.contains(e.target)) closeCombo(); }
function closeCombo() {
  if (!combo) return;
  document.removeEventListener('mousedown', outsideCombo);
  window.removeEventListener('resize', placeCombo);
  window.removeEventListener('scroll', placeCombo, true);
  combo.pop.remove(); combo = null;
}
function comboRank(c, n) {
  if (c.key.startsWith(n)) return 0;          // Anfangsbuchstaben des Namens
  if (c.initials.startsWith(n)) return 1;     // Initialen, z. B. "tf" → Twisted Fate
  if (c.words.some(w => w.startsWith(n))) return 2; // zweites Wort, z. B. "fate"
  if (c.key.includes(n)) return 3;            // irgendwo im Namen
  return 99;
}
function fillCombo(q) {
  const n = norm(q);
  let list = CH_SEARCH;
  if (n) {
    list = CH_SEARCH.map(c => ({ c: c, r: comboRank(c, n) }))
      .filter(x => x.r < 99)
      .sort((a, b) => a.r - b.r || a.c.name.localeCompare(b.c.name))
      .map(x => x.c);
  }
  combo.list = list.slice(0, 80);
  combo.sel = 0;
  paintCombo();
}
function paintCombo() {
  const box = combo.pop.querySelector('.cbx-list');
  if (!combo.list.length) { box.innerHTML = '<div class="cbx-empty">Kein Champion gefunden.</div>'; return; }
  box.innerHTML = combo.list.map((c, i) =>
    '<button type="button" class="cbx-item' + (i === combo.sel ? ' on' : '') + '" onclick="pickChamp(\'' + c.id + '\')">' +
    '<img src="' + champIcon(c.id) + '" alt="">' + esc(c.name) + '</button>').join('');
  const on = box.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  placeCombo();
}
function pickChamp(id) { const i = combo.i; closeCombo(); draft.slots[i].champ = id; renderForm(); }

/* ----- statistics ----- */
function agg() {
  const t = currentTeam(); const ms = teamMatches();
  const players = t ? t.players : [];
  const roster = players.concat([RANDOM]);
  const byPlayer = new Map(roster.map(p => [p.id, { p: p, g: 0, w: 0, s: 0, l: 0, champs: new Map() }]));
  const byChamp = new Map();
  const mode = { regular: { g: 0, top: 0 }, bravery: { g: 0, top: 0 } };
  let w = 0, s = 0, l = 0;
  ms.forEach(m => {
    if (m.result === 'win') w++; else if (m.result === 'second') s++; else l++;
    const top = m.result !== 'loss';
    (m.picks || []).forEach(pk => {
      const rec = byPlayer.get(pk.p);
      if (rec) { rec.g++; rec[m.result === 'win' ? 'w' : m.result === 'second' ? 's' : 'l']++;
        rec.champs.set(pk.c, (rec.champs.get(pk.c) || 0) + 1); }
      if (!byChamp.has(pk.c)) byChamp.set(pk.c, { g: 0, w: 0, top: 0, brav: 0, by: new Map() });
      const c = byChamp.get(pk.c);
      c.g++; if (m.result === 'win') c.w++; if (top) c.top++; if (pk.m === 'bravery') c.brav++;
      c.by.set(pk.p, (c.by.get(pk.p) || 0) + 1);
      const md = mode[pk.m === 'bravery' ? 'bravery' : 'regular'];
      md.g++; if (top) md.top++;
    });
  });
  const shown = roster.filter(p => !p.random || byPlayer.get(p.id).g > 0);
  return { ms: ms, players: players, roster: shown, byPlayer: byPlayer, byChamp: byChamp,
    mode: mode, w: w, s: s, l: l, n: ms.length };
}

          '<td class="num"><span class="rate"><span class="ratebar"><i style="width:' + rate + '%"></i></span>' + (r.g ? rate + ' %' : '–') + '</span></td>' +
          '<td>' + (best ? '<span style="display:inline-flex;align-items:center;gap:7px"><img src="' + champIcon(best[0]) + '" alt="" style="width:24px;height:24px">' + esc(champName(best[0])) + ' ×' + best[1] + '</span>' : '<span class="muted">–</span>') + '</td></tr>';

function tile(k, v, s) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
function seg(v, n, c) { return n ? '<i style="width:' + (v / n * 100) + '%;background:' + c + '"></i>' : ''; }
function lg(c, t) { return '<span><b style="background:' + c + '"></b>' + t + '</span>'; }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtDT(ts) { return new Date(ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }

let chartView = 'player';
function renderChampChart() {

        }).join('');

        '<div class="phead"><span class="pdot" style="background:' + p.color + '"></span>' +
          '<span class="pname-l">' + esc(p.name) + '</span>' +
          '<span class="tiny muted">' + plural(r.g, 'Runde', 'Runden') + ' · ' + pct(r.w + r.s, r.g) + ' % Podium · ' + plural(r.champs.size, 'Champion', 'Champions') + '</span></div>' +
        '<div class="chips">' + chips + '</div></div>';
    }).join('');
    el.innerHTML = head + '<div class="pblocks">' + blocks + '</div>' +
      '<p class="tiny muted" style="margin:14px 0 0">Champions nach Häufigkeit sortiert. Die Prozentzahl ist die Podiumquote des Champions im ganzen Team, nicht nur bei diesem Spieler.</p>';
    return;
  }

  const rows = [...a.byChamp.entries()].sort((x, y) => y[1].g - x[1].g || champName(x[0]).localeCompare(champName(y[0])));
  const cols = a.roster.filter(p => a.byPlayer.get(p.id).g > 0);
  const maxCell = rows.reduce((m, [, c]) => Math.max(m, ...[...c.by.values()]), 1);
  el.innerHTML = head +
    '<div class="scrollx"><table class="matrix"><thead><tr><th>Champion</th>' +

      '<th class="num">Gesamt</th><th class="num">Podium</th></tr></thead><tbody>' +
    rows.map(([id, c]) => {
      const cells = cols.map(p => {
        const n = c.by.get(p.id) || 0;
        if (!n) return '<td class="num dim">·</td>';
        const alpha = 0.14 + (n / maxCell) * 0.4;
        return '<td class="num hit" style="background:' + hexA(p.color, alpha) + '">' + n + '</td>';
      }).join('');
      return '<tr><td class="chcell"><img src="' + champIcon(id) + '" alt="">' + esc(champName(id)) +
        (c.brav ? ' <span class="bmark">B×' + c.brav + '</span>' : '') + '</td>' +

}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(2) + ')';
}

    (ms.length ? (clearArmed
      ? '<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tiny muted">Alle ' + ms.length + ' Runden dieses Teams löschen?</span>' +
        '<button class="btn danger sm" onclick="clearTeamMatches()">Ja, löschen</button>' +
        '<button class="btn ghost sm" onclick="clearArmed=false;renderHistory()">Abbrechen</button></span>'
      : '<span style="display:flex;gap:10px;align-items:center"><span class="tiny muted">' + plural(ms.length, 'Runde', 'Runden') + '</span>' +
        '<button class="btn ghost sm" onclick="clearArmed=true;renderHistory()">Runden löschen</button></span>')
      : '<span class="tiny muted">0 Runden</span>') + '</div>' +
    (ms.length ? '<div class="hist">' + ms.slice(0, 40).map(m => {
      const t = currentTeam();
      const picks = (m.picks || []).map(pk => {
        const p = playerById(t, pk.p);
        return '<div class="hpick"><span class="ic"><img src="' + champIcon(pk.c) + '" alt="">' +
          (pk.m === 'bravery' ? '<span class="bravtag">B</span>' : '') + '</span>' +
          '<span class="txt"><span class="who" style="color:' + (p ? p.color : 'var(--ink-2)') + '">' + esc(p ? p.name : '?') + '</span><br>' +
          '<span class="ch">' + esc(champName(pk.c)) + '</span></span></div>';
      }).join('');
      const del = (confirmDel === m.id
        ? '<button class="btn danger sm" onclick="doDel(\'' + m.id + '\')">Wirklich löschen</button>'
        : '<button class="btn ghost sm" onclick="confirmDel=\'' + m.id + '\';renderHistory()">Löschen</button>');
      return '<div class="hrow"><span class="pill ' + m.result + '">' + RESULTS[m.result].label + '</span>' +
        '<div class="hpicks">' + picks + '</div>' +
        '<span class="hdate">' + fmtDT(m.ts) + '</span>' + del + '</div>';
    }).join('') + '</div>' + (ms.length > 40 ? '<p class="tiny muted" style="margin:10px 0 0">Es werden die letzten 40 Runden gezeigt; die Statistik oben rechnet mit allen ' + ms.length + '.</p>' : '')
    : '<div class="empty">Noch keine Runde eingetragen.</div>');
}
async function doDel(id) { confirmDel = null; try { await delMatch(id); flash('Runde gelöscht.'); } catch (e) { flash('Löschen fehlgeschlagen.', true); } renderHistory(); }

/* ----- champion pool ----- */
function renderPool() {
  const a = agg(); const el = document.getElementById('poolPanel');
  const played = a.byChamp;
  el.innerHTML = '<div class="poolhead"><h2 style="font-size:19px;color:var(--gold-hi)">Champion-Pool</h2>' +
    '<span class="tiny muted"><b style="color:var(--gold-hi)">' + played.size + '</b> von ' + CHAMPS.length + ' Champions gespielt</span></div>' +
    '<div class="poolbar"><i style="width:' + (played.size / CHAMPS.length * 100) + '%"></i></div>' +
    '<div class="pool">' + CHAMPS.map(c => {
      const rec = played.get(c[0]);
      const who = rec ? [...rec.by.entries()].map(([pid, n]) => { const p = a.roster.find(q => q.id === pid); return (p ? p.name : '?') + ' ' + n + '×'; }).join(', ') : 'noch nie gespielt';
      return '<span class="pc' + (rec ? ' played' : '') + '" title="' + esc(c[1] + ' – ' + who) + '">' +
        '<img src="' + c[2] + '" alt="' + esc(c[1]) + '">' +
        (rec ? '<span class="cnt">' + rec.g + '</span>' : '') + '</span>';
    }).join('') + '</div>';
}

/* ----- team dialog ----- */
let dlg = null;
function openTeamDialog(id) {
  const t = id ? teams.find(x => x.id === id) : null;
  dlg = t ? { id: t.id, name: t.name, players: t.players.map(p => Object.assign({}, p)) }
          : { id: null, name: '', players: [{ id: uid(), name: '', color: PALETTE[0] }, { id: uid(), name: '', color: PALETTE[1] }] };
  paintDialog();
}
function paintDialog() {
  const root = document.getElementById('modalRoot');
  if (!dlg) { root.innerHTML = ''; return; }
  root.innerHTML = '<div class="veil" id="veil"><div class="frame modal"><div class="inner">' +
    '<div class="sec-head"><h2>' + (dlg.id ? 'Team bearbeiten' : 'Neues Team') + '</h2></div>' +
    '<label class="eyebrow" for="tname">Teamname</label>' +
    '<input id="tname" class="pname" style="width:100%;margin-top:6px;padding:9px 10px" value="' + esc(dlg.name) + '" placeholder="z. B. Nachtschicht">' +
    '<div class="eyebrow" style="margin-top:16px">Kader (2 bis 5)</div>' +
    '<div class="plist">' + dlg.players.map((p, i) =>
      '<div class="pedit"><span class="swatch" style="background:' + p.color + '"></span>' +
      '<input value="' + esc(p.name) + '" placeholder="Name oder Summoner" oninput="dlg.players[' + i + '].name=this.value">' +
      (dlg.players.length > 2 ? '<button class="btn ghost sm" onclick="dlg.players.splice(' + i + ',1);paintDialog()">Raus</button>' : '') +
      '</div>').join('') + '</div>' +
    (dlg.players.length < 5 ? '<button class="btn ghost sm" onclick="addPlayerRow()">+ Spieler</button>' : '') +
    '<div class="rowend">' +
      (dlg.id ? '<button class="btn danger" onclick="askDeleteTeam()">Team löschen</button>' : '') +
      '<button class="btn ghost" onclick="dlg=null;paintDialog()">Abbrechen</button>' +
      '<button class="btn primary" onclick="saveDialog()">Speichern</button>' +
    '</div></div></div></div>';
  const nameEl = document.getElementById('tname');
  nameEl.addEventListener('input', e => { dlg.name = e.target.value; });
  document.getElementById('veil').addEventListener('mousedown', e => { if (e.target.id === 'veil') { dlg = null; paintDialog(); } });
  if (!dlg.name) nameEl.focus();
}
function addPlayerRow() { dlg.players.push({ id: uid(), name: '', color: PALETTE[dlg.players.length % PALETTE.length] }); paintDialog(); }
async function saveDialog() {
  const name = (dlg.name || '').trim() || 'Unser Team';
  const players = dlg.players.map((p, i) => ({ id: p.id, name: (p.name || '').trim() || ('Spieler ' + (i + 1)), color: PALETTE[i % PALETTE.length] }));
  if (players.length < 2) { flash('Ein Team braucht mindestens zwei Spieler.', true); return; }
  const payload = { id: dlg.id, name: name, players: players };
  dlg = null; paintDialog();
  try {
    const newId = await putTeam(payload);
    curTeamId = newId; resetDraft();
    if (storeMode === 'local') { applySeed(); renderAll(); }
    flash('Team gespeichert.');
  } catch (e) { flash('Team konnte nicht gespeichert werden (' + (e && e.code ? e.code : 'Fehler') + ').', true); }
}
async function askDeleteTeam() {
  const id = dlg.id; const name = dlg.name;
  dlg = null; paintDialog();
  if (!id) return;
  flash('Team "' + name + '" wird mit allen Runden gelöscht …');
  try { await removeTeam(id); curTeamId = teams[0] ? teams[0].id : null; renderAll(); flash('Team gelöscht.'); }
  catch (e) { flash('Löschen fehlgeschlagen.', true); }
}

/* ----- wiring ----- */
document.getElementById('teamSel').addEventListener('change', e => { curTeamId = e.target.value; confirmDel = null; resetDraft(); renderAll(); });
document.getElementById('newTeam').addEventListener('click', () => openTeamDialog(null));
document.getElementById('editTeam').addEventListener('click', () => { const t = currentTeam(); if (t) openTeamDialog(t.id); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (combo) closeCombo(); else if (dlg) { dlg = null; paintDialog(); } } });

/* ----- boot ----- */
loadLocal();
applySeed();
resetDraft();
renderAll();
connectDb();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
